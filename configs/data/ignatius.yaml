# Primary video source. BLOCKED_INPUT until a genuine qualified model exists.
schema_version: prepared-v1
dataset_name: ignatius-video-v1
source:
  mode: video
  image_root: datasets/tanks_and_temples/Ignatius/preprocessing/selected_frames/video_v0
  model_dir: outputs/tanks_and_temples/Ignatius/sfm_colmap/video_v0/sparse
  format: auto
  comparison_model_dir: null
  manifest: datasets/tanks_and_temples/Ignatius/preprocessing/selected_frames/video_v0/manifest.json
  ba_history: BLOCKED_GPU_BA; mapper not executed
  discovery_roots:
    - outputs/tanks_and_temples/Ignatius/sfm_colmap/video_v0
output:
  dataset_root: datasets/tanks_and_temples/Ignatius/prepared/video_v1
  report_root: outputs/tanks_and_temples/Ignatius/data_preparation/video_v1
  file_mode: copy
images:
  undistort: auto
  max_width: null
  format: preserve
  jpeg_quality: 95
split:
  strategy: interleaved
  seed: 42
  ratios: [0.75, 0.125, 0.125]
  period: 8
  test_offset: 0
  val_offset: 4
  protocol: fixed_pose_transductive
validation:
  quaternion_tolerance: 0.000001
  rotation_tolerance: 0.000000001
  warn_reprojection_px: 4.0
  max_reprojection_p95_px: 10.0
  min_registered_images: 3
  min_points: 1
  min_track_length: 2
  min_observations_per_image: 1
filter:
  duplicate_tracks: reject
  outside_image_tracks: reject
  max_point_error_px: null
normalization:
  enabled: true
training_points:
  min_train_views: 2
  min_parallax_degrees: 0.0
